# =============================================================================
# 약어/동의어 사전 — 공개 예시 (aliases.example.yaml)
# =============================================================================
# 이 파일은 두 가지 역할을 한다.
#   1) 사전 파일의 "형식(양식)"을 보여주는 예시
#   2) 세상이 다 아는 공통 기술용어의 실제 사전 (그대로 로드되어 사용됨)
#
# 사내 고유 약어(SR, CM 등 우리 회사만 아는 것)는 여기에 넣지 않는다.
#   -> 사내 자산이므로 data/private/aliases.yaml (git 미추적) 에 따로 관리한다.
#   -> 로더는 public(이 파일) + private 를 합쳐 쓰고, 겹치면 private 가 우선한다.
#
# -----------------------------------------------------------------------------
# 형식
# -----------------------------------------------------------------------------
#   - canonical : 통일할 "정식 이름" (그래프 노드/검색에서 대표로 쓰는 표기)
#   - aliases   : 같은 것으로 취급할 다른 표기들 (대소문자는 자동 무시)
#   - desc      : (선택) 무슨 뜻인지 메모
#
# 예) 문서에 k8s / kube / 쿠버네티스 로 적혀 있어도 전부 "Kubernetes" 하나로 모인다.
#
# -----------------------------------------------------------------------------
# 사내 사전(private) 만드는 방법 — 반자동 후보탐지
# -----------------------------------------------------------------------------
#   1) 사내 원문은 반드시 data/private/ 에만 .md 로 저장한다(사내 자산·git 미추적).
#      data/public/ 에는 공개 가능한 예시/데모만 둔다.
#   2) 후보 탐지기를 돌린다:
#         .venv/bin/python -m preprocessing.abbrev_candidates
#      -> data/private/aliases.candidates.yaml 에 "약어 후보 목록"이 생성된다.
#         (문서의 "정식명칭(약어)" 패턴 + 반복되는 대문자 약어를 자동 수집)
#   3) 사람이 후보를 검토한다:
#        - 진짜 약어면 canonical(정식명칭)을 채우고
#        - 약어가 아니면 그 항목을 지운다
#   4) 확정된 항목을 data/private/aliases.yaml 로 옮긴다.
#   5) 그래프를 재적재하면 자동으로 통일되어 저장된다:
#         .venv/bin/python -m graph.ingest
# =============================================================================

- canonical: Kubernetes
  aliases: [k8s, kube, 쿠버네티스]
  desc: 컨테이너 오케스트레이션 플랫폼

- canonical: Pod
  aliases: [파드]
  desc: Kubernetes의 최소 배포 단위

- canonical: Deployment
  aliases: [디플로이먼트]
  desc: Pod의 배포와 스케일을 관리하는 Kubernetes 리소스
